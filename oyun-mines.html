<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robux Mines — CynoRobux</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div style="margin-bottom: 18px;">
      <a href="oyunlar.html" style="color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600;">← Oyunlara Dön</a>
    </div>

    <div class="game-layout">
      <div class="control-panel">
        <h2 style="font-size: 20px; margin-bottom: 18px;">💎 Robux Mines</h2>

        <div class="form-group">
          <label>Yatırılacak Robux (R$)</label>
          <input type="number" id="mines-bet" class="form-control" value="100" min="50">
        </div>

        <div class="form-group">
          <label>Mayın Sayısı</label>
          <select id="mines-count" class="form-control">
            <option value="3">3 Mayın (Kolay)</option>
            <option value="5" selected>5 Mayın (Orta)</option>
            <option value="8">8 Mayın (Zor • Yüksek Çarpan)</option>
          </select>
        </div>

        <button id="mines-start-btn" onclick="startMines()" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 15px;">
          💎 Oyunu Başlat
        </button>

        <button id="mines-cashout-btn" onclick="cashoutMines()" class="btn btn-primary" style="display: none; width: 100%; padding: 14px; font-size: 15px; background: #ffa502; color: #000;">
          💰 Ödülü Topla (<span id="mines-win-val">0</span> R$)
        </button>

        <div style="margin-top: 20px; background: var(--bg-dark); padding: 14px; border-radius: 12px; border: 1px solid var(--border-color);">
          <div style="font-size: 12px; color: var(--text-muted);">ANLIK ÇARPAN</div>
          <div id="mines-mult" style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 800; color: var(--roblox-green);">1.00x</div>
        </div>
      </div>

      <div class="arena-panel">
        <div id="mines-grid" class="mines-grid"></div>
        <p id="mines-status" style="margin-top: 18px; font-size: 14px; color: var(--text-muted);">Sol panelden bahis miktarını seç ve oyunu başlat.</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    renderLayout('oyunlar');

    let minesActive = false;
    let bombIndices = [];
    let revealedCount = 0;
    let minesBet = 0;
    let minesMultiplier = 1.00;

    function buildEmptyGrid() {
      const grid = document.getElementById('mines-grid');
      grid.innerHTML = '';
      for (let i = 0; i < 25; i++) {
        const btn = document.createElement('button');
        btn.className = 'mine-tile';
        btn.disabled = true;
        btn.textContent = '?';
        grid.appendChild(btn);
      }
    }
    buildEmptyGrid();

    function startMines() {
      const user = AppState.getUser();
      if (!user || !user.loggedIn) {
        showToast('Oynamak için giriş yapmalısın!', true);
        return;
      }
      const bet = Number(document.getElementById('mines-bet').value);
      const bombs = Number(document.getElementById('mines-count').value);
      if (bet < 50 || bet > user.balance) {
        showToast('Geçersiz miktar veya yetersiz bakiye (Min: 50 R$)!', true);
        return;
      }

      AppState.addBalance(-bet, 'Robux Mines Bahis');
      minesBet = bet;
      minesActive = true;
      revealedCount = 0;
      minesMultiplier = 1.00;
      bombIndices = [];

      while (bombIndices.length < bombs) {
        const r = Math.floor(Math.random() * 25);
        if (!bombIndices.includes(r)) bombIndices.push(r);
      }

      document.getElementById('mines-mult').textContent = '1.00x';
      document.getElementById('mines-win-val').textContent = bet;
      document.getElementById('mines-start-btn').style.display = 'none';
      document.getElementById('mines-cashout-btn').style.display = 'inline-flex';
      document.getElementById('mines-status').textContent = 'Yeşil Robux elmaslarını bul! İstediğin an ödülü topla.';

      const grid = document.getElementById('mines-grid');
      grid.innerHTML = '';
      for (let i = 0; i < 25; i++) {
        const btn = document.createElement('button');
        btn.className = 'mine-tile';
        btn.onclick = () => clickTile(i, btn);
        grid.appendChild(btn);
      }
    }

    function clickTile(idx, btn) {
      if (!minesActive || btn.disabled) return;
      btn.disabled = true;

      const bombs = Number(document.getElementById('mines-count').value);

      if (bombIndices.includes(idx)) {
        btn.classList.add('revealed-bomb');
        btn.textContent = '💣';
        revealAllBombs();
        minesActive = false;
        document.getElementById('mines-start-btn').style.display = 'inline-flex';
        document.getElementById('mines-cashout-btn').style.display = 'none';
        document.getElementById('mines-status').innerHTML = '<span style="color:var(--danger); font-weight:700;">💥 Mayına bastın! Bahis kaybedildi.</span>';
        showToast('Mayına bastın!', true);
      } else {
        revealedCount++;
        btn.classList.add('revealed-gem');
        btn.textContent = '🟩';
        const stepFactor = 1 + (bombs * 0.055);
        minesMultiplier = +(minesMultiplier * stepFactor).toFixed(2);
        const currentWin = Math.floor(minesBet * minesMultiplier);
        document.getElementById('mines-mult').textContent = minesMultiplier.toFixed(2) + 'x';
        document.getElementById('mines-win-val').textContent = currentWin;
      }
    }

    function revealAllBombs() {
      const tiles = document.getElementById('mines-grid').children;
      for (let i = 0; i < 25; i++) {
        tiles[i].disabled = true;
        if (bombIndices.includes(i)) {
          tiles[i].classList.add('revealed-bomb');
          tiles[i].textContent = '💣';
        }
      }
    }

    function cashoutMines() {
      if (!minesActive) return;
      if (revealedCount === 0) {
        showToast('Ödül toplamak için en az 1 kutu açmalısın!', true);
        return;
      }
      minesActive = false;
      const winAmount = Math.floor(minesBet * minesMultiplier);
      AppState.addBalance(winAmount, `Mines Kazancı (${minesMultiplier.toFixed(2)}x)`);
      revealAllBombs();
      document.getElementById('mines-start-btn').style.display = 'inline-flex';
      document.getElementById('mines-cashout-btn').style.display = 'none';
      document.getElementById('mines-status').innerHTML = `<span style="color:var(--roblox-green); font-weight:800;">🎉 Tebrikler! +${winAmount} R$ hesabına aktarıldı!</span>`;
      showToast(`+${winAmount} R$ kazandın!`);
    }
  </script>
  <!-- Oyunun kendi kodları burada biter -->
    
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCQSylUFCxkOcyZQwobbNnzcJX6QcEIQGs",
        authDomain: "cynorobux.firebaseapp.com",
        databaseURL: "https://cynorobux-default-rtdb.firebaseio.com",
        projectId: "cynorobux",
        storageBucket: "cynorobux.firebasestorage.app",
        messagingSenderId: "854181611047",
        appId: "1:854181611047:web:db37f6a281bca890d67002",
        measurementId: "G-8PQFNEH1F3"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      window.addEventListener('DOMContentLoaded', () => {
        const currentUser = localStorage.getItem('cynoUser');
        const authContainer = document.getElementById('auth-buttons') || document.querySelector('.nav-auth') || document.getElementById('user-info-area');
        const bakiyeText = document.getElementById('live-bakiye') || document.getElementById('user-bakiye');

        if (!currentUser) {
          if (bakiyeText) bakiyeText.textContent = '0 R$';
          return;
        }

        const userRef = ref(db, 'users/' + currentUser);
        get(userRef).then((snapshot) => {
          if (snapshot.exists()) {
            const userData = snapshot.val();
            const guncelBakiye = userData.bakiye || 0;
            
            if (bakiyeText) bakiyeText.textContent = guncelBakiye + ' R$';
            localStorage.setItem('cynoBakiye', guncelBakiye);

            const userAdText = document.getElementById('username-display');
            if (userAdText) userAdText.textContent = currentUser;
          }
        });
      });
    </script>
  </body>
</html>
</body>
</html>
