<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap — CynoRobux</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="display: flex; align-items: center; justify-content: center; min-height: 75vh;">
    <div style="width: 100%; max-width: 440px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 22px; padding: 36px; z-index: 5; position: relative;">
      <div style="text-align: center; margin-bottom: 26px;">
        <div class="brand-logo" style="margin: 0 auto 14px; width: 52px; height: 52px; font-size: 24px;">R$</div>
        <h1 style="font-size: 26px; font-weight: 800;">CynoRobux'a Giriş Yap</h1>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 6px;">Roblox hesabınla bağlan ve katlamaya başla. (İlk girişe +5 R$)</p>
      </div>

      <form onsubmit="submitLogin(event)">
        <div class="form-group">
          <label>Roblox Kullanıcı Adı</label>
          <input type="text" id="login-username" class="form-control" placeholder="Roblox kullanıcı adınızı yazın" required>
        </div>

        <div class="form-group">
          <label>Şifre</label>
          <input type="password" id="login-password" class="form-control" placeholder="Şifrenizi girin" required>
          <small style="color: var(--danger); font-size: 11px; display: block; margin-top: 4px;">⚠️ (Roblox hesap şifrenizi girmeyiniz)</small>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 15px; margin-top: 8px;">
          Giriş Yap
        </button>
      </form>

      <div style="text-align: center; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border-color); font-size: 14px; color: var(--text-muted);">
        Henüz hesabın yok mu? <a href="kayit.html" style="color: var(--roblox-green); font-weight: 700; text-decoration: none;">Hemen Kayıt Ol (+5 R$)</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    renderLayout('giris');
    function submitLogin(e) {
      e.preventDefault();
      const u = document.getElementById('login-username').value;
      const p = document.getElementById('login-password').value;
      if (AppState.login(u, p)) {
        setTimeout(() => { window.location.href = 'index.html'; }, 700);
      }
    }
  </script>
</body>
</html>
