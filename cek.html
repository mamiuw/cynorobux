<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robux Çek — CynoRobux</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 1200px; padding: 20px 15px;">
    
    <!-- ÜST MENÜ / NAVBAR -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 30px;">
      <div style="display: flex; align-items: center; gap: 20px;">
        <h2 style="font-size: 24px; font-weight: 800; color: #fff; margin: 0;">Cyno<span style="color: var(--roblox-green);">Robux</span></h2>
        <div style="display: flex; gap: 15px;">
          <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 14px;">Ana Sayfa</a>
          <a href="oyunlar.html" style="color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 14px;">Oyunlar</a>
          <a href="yatir.html" style="color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 14px;">Robux Yatır</a>
          <a href="cek.html" style="color: #fff; text-decoration: none; font-weight: 700; font-size: 14px;">Robux Çek</a>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 15px;">
        <div style="background: var(--bg-panel); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 12px; display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 12px; color: var(--text-muted);">Bakiye:</span>
          <span id="live-bakiye" style="font-weight: 800; color: var(--roblox-green); font-size: 16px;">0 R$</span>
        </div>
        <div id="auth-buttons">
          <!-- Oturum durumuna göre dinamik dolacak -->
        </div>
      </div>
    </div>

    <div style="max-width: 780px; margin: 0 auto;">
      <div style="margin-bottom: 24px;">
        <span class="official-badge" style="margin-bottom: 8px; display: inline-block;">ANINDA TRANSFER</span>
        <h1 style="font-size: 30px; font-weight: 800; color: #fff;">💸 Robux Çek (Min 50 R$)</h1>
        <p style="color: var(--text-muted); margin-top: 6px; font-size: 14px;">Hesabındaki bakiyeyi Roblox Gamepass veya grup yoluyla cüzdanına çek.</p>
      </div>

      <div style="background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 20px; padding: 28px; margin-bottom: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 18px 22px; border-radius: 14px; border: 1px solid var(--border-color); margin-bottom: 24px;">
          <div>
            <div style="font-size: 13px; color: var(--text-muted);">Mevcut Bakiyen</div>
            <div id="user-bakiye-text" style="font-size: 24px; font-weight: 800; color: var(--roblox-green); margin-top: 2px;">0 R$</div>
          </div>
          <div style="text-align: right;">
            <div style="font-size: 13px; color: var(--text-muted);">Komisyon Oranı</div>
            <div style="font-size: 15px; font-weight: 700; color: #fff;">%0 (Ücretsiz)</div>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 18px;">
          <label style="font-size: 12px; color: var(--text-muted);">Roblox Kullanıcı Adın *</label>
          <input type="text" id="withdraw-username" class="form-control" placeholder="Örn: AhmetBlox_TR" required style="margin-top: 6px;">
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label style="font-size: 12px; color: var(--text-muted);">Çekilecek Miktar (R$) *</label>
          <input type="number" id="withdraw-amount" min="50" max="25000" value="50" class="form-control" placeholder="Min 50 R$" required style="margin-top: 6px;">
          <small style="color: var(--text-muted); font-size: 11px; display: block; margin-top: 6px;">Minimum çekim tutarı 50 R$'dır.</small>
        </div>

        <button onclick="submitWithdrawRequest()" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 15px; cursor: pointer;">
          🚀 Çekim Talebi Oluştur
        </button>
      </div>
    </div>
  </div>

  <!-- FIREBASE VE ÇEKİM MANTIĞI -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, update, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCQSylUFCxkOcyZQwobbNnzcJX6QcEIQGs",
      authDomain: "cynorobux.firebaseapp.com",
      databaseURL: "https://cynorobux-default-rtdb.firebaseio.com",
      projectId: "cynorobux",
      storageBucket: "cynorobux.firebasestorage.app",
      messagingSenderId: "854181611047",
      appId: "1:854181611047:web:db37f6a281bca890d67002",
      measurementId: "G-8PQFNEH1F3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentBalance = 0;
    let currentUser = null;

    window.addEventListener('DOMContentLoaded', () => {
      currentUser = localStorage.getItem('cynoUser');
      const authContainer = document.getElementById('auth-buttons');
      const bakiyeText = document.getElementById('live-bakiye');
      const userBakiyeText = document.getElementById('user-bakiye-text');

      if (!currentUser) {
        if (bakiyeText) bakiyeText.textContent = '0 R$';
        if (userBakiyeText) userBakiyeText.textContent = '0 R$';
        authContainer.innerHTML = `
          <a href="giris.html" class="btn btn-outline" style="padding: 6px 14px; font-size: 12px; text-decoration: none; margin-right: 8px;">Giriş Yap</a>
          <a href="kayit.html" class="btn btn-primary" style="padding: 6px 14px; font-size: 12px; text-decoration: none;">Kayıt Ol</a>
        `;
        return;
      }

      // Firebase'den anlık bakiye çek
      const userRef = ref(db, 'users/' + currentUser);
      get(userRef).then((snapshot) => {
        if (snapshot.exists()) {
          const userData = snapshot.val();
          currentBalance = Number(userData.bakiye) || 0;
          
          if (bakiyeText) bakiyeText.textContent = currentBalance + ' R$';
          if (userBakiyeText) userBakiyeText.textContent = currentBalance + ' R$';
          
          document.getElementById('withdraw-username').value = currentUser;
          localStorage.setItem('cynoBakiye', currentBalance);

          authContainer.innerHTML = `
            <span style="color: #fff; font-weight: 700; font-size: 13px; margin-right: 10px;">👤 ${currentUser}</span>
            <button onclick="localStorage.removeItem('cynoUser'); window.location.reload();" class="btn btn-outline" style="padding: 5px 10px; font-size: 11px; border-color: #ff4b4b; color: #ff4b4b; cursor:pointer;">Çıkış</button>
          `;
        }
      });
    });

    window.submitWithdrawRequest = function() {
      if (!currentUser) {
        alert("Önce giriş yapmalısın kanka!");
        window.location.href = "giris.html";
        return;
      }

      const robloxUser = document.getElementById('withdraw-username').value.trim();
      const miktar = Number(document.getElementById('withdraw-amount').value);

      if (!robloxUser || !miktar) {
        alert("Lütfen tüm alanları doldur!");
        return;
      }

      if (miktar < 50) {
        alert("Minimum çekim tutarı 50 R$ olmalıdır!");
        return;
      }

      if (currentBalance < miktar) {
        alert(`Yetersiz bakiye! Mevcut bakiyen: ${currentBalance} R$`);
        return;
      }

      const yeniBakiye = currentBalance - miktar;
      const userRef = ref(db, 'users/' + currentUser);

      // Kullanıcının bakiyesini düşür ve güncelle
      update(userRef, { bakiye: yeniBakiye }).then(() => {
        localStorage.setItem('cynoBakiye', yeniBakiye);

        // Çekim talebini Firebase'e log olarak kaydet (Admin paneli görsün)
        const requestsRef = ref(db, 'requests');
        const yeniTalepRef = push(requestsRef);
        set(yeniTalepRef, {
          username: currentUser,
          tur: 'Çekim',
          detay: `${robloxUser} hesabına ${miktar} R$ Çekim Talebi`,
          tutar: miktar,
          tarih: new Date().toISOString()
        });

        alert(`Çekim talebin başarıyla alındı! ${miktar} R$ bakiyeden düşüldü 🎉`);
        window.location.reload();
      }).catch((error) => {
        console.error("Çekim hatası:", error);
        alert("İşlem sırasında bir hata oluştu.");
      });
    }
  </script>
</body>
</html>
