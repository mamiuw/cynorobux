<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Girişi — CynoRobux Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div style="width: 100%; max-width: 420px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 22px; padding: 36px; z-index: 5;">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="brand-logo" style="margin: 0 auto 14px; width: 52px; height: 52px; font-size: 24px;">🛡️</div>
      <h1 style="font-size: 24px; font-weight: 800;">Yönetici Girişi</h1>
      <p style="color: var::text-muted); font-size: 13px; margin-top: 6px;">CynoRobux özel admin yetki paneli.</p>
    </div>

    <form onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label>Admin Kullanıcı Adı</label>
        <input type="text" id="adm-user" class="form-control" placeholder="marlon veya mami" required>
      </div>

      <div class="form-group">
        <label>Şifre</label>
        <input type="password" id="adm-pass" class="form-control" placeholder="••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 15px; margin-top: 10px;">
        Admin Paneline Giriş Yap
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
      <a href="index.html" style="color: var(--text-muted); font-size: 13px; text-decoration: none;">← Ana Siteye Dön</a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    function handleAdminLogin(e) {
      e.preventDefault();
      const u = document.getElementById('adm-user').value.trim();
      const p = document.getElementById('adm-pass').value.trim();

      const validAdmins = [
        { user: 'marlon', pass: '1212' },
        { user: 'mami', pass: '1212' }
      ];

      const match = validAdmins.find(a => a.user === u && a.pass === p);
      if (match) {
        localStorage.setItem('cynorobux_admin_auth', JSON.stringify({ user: match.user, time: Date.now() }));
        showToast(`Yönetici olarak giriş yapıldı: ${match.user}`);
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 800);
      } else {
        showToast('Hatalı admin kullanıcı adı veya şifresi!', true);
      }
    }
  </script>
</body>
</html>
