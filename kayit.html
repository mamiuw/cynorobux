<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıt Ol — CynoRobux</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="display: flex; align-items: center; justify-content: center; min-height: 75vh;">
    <div style="width: 100%; max-width: 480px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 22px; padding: 36px; z-index: 5; position: relative;">
      <div style="text-align: center; margin-bottom: 24px;">
        <span class="official-badge" style="margin-bottom: 10px; display: inline-block;">YENİ ÜYELERE +5 R$ HEDİYE</span>
        <h1 style="font-size: 26px; font-weight: 800;">CynoRobux Hesabı Oluştur</h1>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 6px;">Gamepass yatırımları ve anında çekim için hesap aç.</p>
      </div>

      <form onsubmit="submitRegister(event)">
        <div class="form-group">
          <label>Roblox Kullanıcı Adı *</label>
          <input type="text" id="reg-username" class="form-control" placeholder="Örn: AhmetBlox_TR" required>
        </div>

        <div class="form-group">
          <label>Hesap Şifresi *</label>
          <input type="password" id="reg-password" class="form-control" placeholder="En az 4 karakter" required>
          <small style="color: var(--danger); font-size: 11px; display: block; margin-top: 6px;">⚠️ (Roblox hesap şifrenizi girmeyiniz)</small>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 15px; margin-top: 10px;">
          Kayıt Ol ve 5 R$ Al
        </button>
      </form>

      <div style="text-align: center; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border-color); font-size: 14px; color: var(--text-muted);">
        Zaten hesabın var mı? <a href="giris.html" style="color: var(--roblox-green); font-weight: 700; text-decoration: none;">Giriş Yap</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    renderLayout('kayit');
    
    // Form gönderildiğinde Firebase kayıt fonksiyonunu tetikle
    function submitRegister(e) {
      e.preventDefault();
      const u = document.getElementById('reg-username').value;
      const p = document.getElementById('reg-password').value;
      
      if (window.cynoKayitOl) {
        window.cynoKayitOl(u, p);
      } else {
        alert("Firebase henüz yüklenmedi kanka, 1 saniye bekleyip tekrar dene!");
      }
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Firebase Bağlantısı
    const firebaseConfig = {
      apiKey: "AIzaSyCQSylUFCxkOcyZQwobbNnzcJX6QcEIQGs",
      authDomain: "cynorobux.firebaseapp.com",
      databaseURL: "https://cynorobux-default-rtdb.firebaseio.com",
      projectId: "cynorobux",
      storageBucket: "cynorobux.firebasestorage.app",
      messagingSenderId: "854181611047",
      appId: "1:854181611047:web:db37f6a281bca890d67002",
      measurementId: "G-8PQFNEH1F3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Kayıt olma fonksiyonu
    window.cynoKayitOl = function(username, password) {
      if (!username || !password) {
        alert("Lütfen tüm alanları doldur!");
        return;
      }

      const userRef = ref(db, 'users/' + username);

      // Önce bu kullanıcı adı var mı diye kontrol et
      get(userRef).then((snapshot) => {
        if (snapshot.exists()) {
          alert("Bu kullanıcı adı zaten alınmış kanka!");
        } else {
          // Kullanıcıyı kaydet ve 5 Robux bonus ver
          set(userRef, {
            username: username,
            password: password,
            bakiye: 5, // 5 Robux kayıt bonusu
            banned: false,
            kayitTarihi: new Date().toISOString()
          }).then(() => {
            alert("Kayıt başarılı! 5 Robux bonus hesabına eklendi 🎉");
            window.location.href = "giris.html"; // Giriş sayfasına yönlendir
          });
        }
      }).catch((error) => {
        console.error("Kayıt hatası:", error);
      });
    }
  </script>
</body>
</html>
